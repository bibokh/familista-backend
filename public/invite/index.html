<!-- Onboarding, for somebody who has never seen Familista and has no session.
     Its own small document rather than the club workspace: booting a signed-in
     application at a stranger spends a megabyte to show a form and then bounces
     them to a login screen they cannot use. -->
<title>Familista — accept your invitation</title>
<!-- An external stylesheet, not a <style> block: this origin's CSP sends
     style-src 'self' with no 'unsafe-inline', which discards inline CSS.
     See the header of invite.css. -->
<link rel="stylesheet" href="/invite/invite.css?v=20260911-invite" />
</head>
<body>
  <div class="shell">
    <main class="card">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div class="brand-name">Famili<em>sta</em></div>
      </div>
      <div class="body" id="invite-root">
        <div class="skeleton" aria-busy="true" aria-live="polite">
          <div class="skel-line skel-line--title"></div>
          <div class="skel-line skel-line--wide"></div>
          <div class="skel-box"></div>
          <div class="skel-line skel-line--block"></div>
        </div>
      </div>
    </main>
    <p class="foot">Familista — football connects the world</p>
  </div>
  <script src="/invite/invite.js?v=20260910-invite"></script>
</body>
</html>
