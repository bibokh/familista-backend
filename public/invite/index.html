<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<!-- A page reached from an email by somebody with no session. Its own small
     document rather than the club workspace: booting a signed-in application
     at a stranger would spend a megabyte to show a form and then bounce them
     to a login screen they cannot use. -->
<title>Familista — invitation</title>
<style>
  :root {
    --bg: #070b14; --panel: rgba(18, 25, 42, .78); --line: rgba(255, 255, 255, .08);
    --line-2: rgba(255, 255, 255, .14); --tx: #e9eefb; --tx-2: #98a3bd; --tx-3: #67718c;
    --accent: #3b82f6; --ok: #34d399; --warn: #fbbf24; --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--tx);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  .card {
    width: min(460px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; overflow: hidden;
  }
  .head { padding: 26px 30px 20px; border-bottom: 1px solid var(--line); text-align: center; }
  .brand { font-size: 21px; font-weight: 800; letter-spacing: -.4px; }
  .brand span { color: var(--accent); }
  .body { padding: 26px 30px 30px; }
  h1 { margin: 0 0 6px; font-size: 17px; font-weight: 800; letter-spacing: -.2px; }
  p { margin: 0 0 14px; color: var(--tx-2); font-size: 13px; }
  .facts { background: rgba(255,255,255,.04); border-radius: 11px; padding: 13px 15px; margin: 0 0 20px; }
  .fact { display: flex; gap: 12px; font-size: 12.5px; padding: 3px 0; }
  .fact > span { color: var(--tx-3); min-width: 78px; }
  .fact > b { font-weight: 700; overflow-wrap: anywhere; }
  label { display: block; margin: 0 0 12px; }
  label > span { display: block; font-size: 11.5px; font-weight: 600; color: var(--tx-2); margin-bottom: 5px; }
  input {
    width: 100%; padding: 11px 13px; border-radius: 10px; font: inherit; font-size: 14px;
    background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--tx);
  }
  input:focus { outline: none; border-color: var(--accent); background: rgba(59,130,246,.08); }
  input[readonly] { color: var(--tx-2); cursor: not-allowed; }
  .row { display: flex; gap: 10px; }
  .row > label { flex: 1; }
  button {
    width: 100%; padding: 13px 18px; border-radius: 11px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 700;
  }
  button:hover:not([disabled]) { filter: brightness(1.1); }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  .link { background: none; color: var(--tx-2); font-weight: 600; font-size: 12.5px; padding: 10px; text-decoration: underline; }
  .note { font-size: 11.5px; color: var(--tx-3); margin: 14px 0 0; }
  .msg { border-radius: 10px; padding: 12px 14px; font-size: 12.5px; margin: 0 0 16px; }
  .msg--error { background: rgba(248,113,113,.12); color: #fecaca; border: 1px solid rgba(248,113,113,.3); }
  .msg--ok { background: rgba(52,211,153,.12); color: #a7f3d0; border: 1px solid rgba(52,211,153,.3); }
  .ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; margin: 0 auto 14px; }
  .ico--ok { background: rgba(52,211,153,.14); color: #6ee7b7; }
  .ico--bad { background: rgba(248,113,113,.14); color: #fecaca; }
  .centre { text-align: center; }
  .skel { height: 130px; border-radius: 12px; background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.07), rgba(255,255,255,.04)); }
</style>
</head>
<body>
  <main class="card">
    <div class="head"><div class="brand">Famili<span>sta</span></div></div>
    <div class="body" id="invite-root"><div class="skel"></div></div>
  </main>
  <script src="/invite/invite.js?v=20260909-invite"></script>
</body>
</html>
