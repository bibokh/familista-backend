# Familista — Deploy: trigger Render deploy after CI passes on main.
# Render autoDeploy is enabled in render.yaml, so this workflow is mainly a
# safety net for explicit manual deploys / rollbacks via deploy hook.
#
# Required secrets (set under repo Settings → Secrets and variables → Actions):
#   • RENDER_DEPLOY_HOOK_URL  — full URL from Render → Service → Settings → Deploy Hook
#   • RENDER_API_TOKEN        — (optional) for listing deploy history

name: deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why is this deploy being triggered manually?'
        required: false
        default: 'manual-redeploy'
  workflow_run:
    workflows: ['ci']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  trigger-render:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 5
    steps:
      # Cyber Defense, Step 9: every value arrives through `env`, never by
      # `${{ }}` expansion inside the script. A dispatch input expanded into a
      # script is script injection; read from an environment variable it is
      # only ever data. The reason is also reduced to a short, safe token.
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_REASON: ${{ github.event.inputs.reason }}
          DEPLOY_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL not set; skipping (Render autoDeploy will handle it)"
            exit 0
          fi
          reason="$(printf '%s' "${DEPLOY_REASON:-ci-success}" | tr -cd 'A-Za-z0-9._ -' | cut -c1-80)"
          reason="${reason:-ci-success}"
          ref="$(printf '%s' "$DEPLOY_REF" | tr -cd '0-9a-f' | cut -c1-40)"
          echo "Triggering Render deploy (reason: ${reason})"
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" \
            -H 'content-type: application/json' \
            -d "{\"reason\":\"${reason}\",\"ref\":\"${ref}\"}"
