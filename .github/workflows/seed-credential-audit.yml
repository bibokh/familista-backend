# TEMPORARY — read-only seed/demo credential audit (removed right after it runs)
#
# Runs only on a push of this file to the session branch; never on main, never
# on a schedule, never by a third party. Uses the AUDIT_DATABASE_URL repository
# secret (GitHub masks it in logs; the script never prints it). The script opens
# a READ ONLY transaction, confirms it with PostgreSQL, compares bcrypt hashes
# in memory with the two passwords the repository already publishes, prints
# only counts and minimal ids, and rolls back. Nothing is written anywhere.
name: seed-credential-audit (temporary, read-only)

on:
  push:
    branches: [claude/laughing-dirac-xxpc62]
    paths: [.github/workflows/seed-credential-audit.yml]

permissions:
  contents: read

concurrency:
  group: seed-credential-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Install (no scripts) and generate the Prisma client
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prisma generate --schema=prisma/schema.prisma >/dev/null

      - name: Read-only audit
        env:
          DATABASE_URL: ${{ secrets.AUDIT_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "AUDIT_DATABASE_URL is not set"; exit 1; fi
          node scripts/security/seed-credential-audit.js
