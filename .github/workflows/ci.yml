# Familista — CI: type-check, prisma, boot probe, contracts and tests on every PR.
# Production deploys go through render.yaml → autoDeploy on main.
# This workflow only validates the change; it never touches infra.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cyber Defense, Step 9: least privilege. Every job reads the repository and
# nothing else; no job can push, comment, open issues or touch packages with
# the token GitHub hands it. A job that needs more must say so itself.
permissions:
  contents: read

jobs:
  validate:
    name: validate (tsc + prisma + boot probe + contracts + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: familista_ci
          POSTGRES_USER: familista_ci
          POSTGRES_PASSWORD: familista_ci_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U familista_ci -d familista_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV:           test
      DATABASE_URL:       postgresql://familista_ci:familista_ci_pw@localhost:5432/familista_ci
      # The schema declares `directUrl = env("DIRECT_URL")`, and Prisma refuses
      # to run a migration when a declared datasource variable is missing — it
      # does NOT fall back to DATABASE_URL. `scripts/db-migrate.js` sets both
      # for real deployments; this step calls `prisma migrate deploy` directly,
      # so CI has to say it here. Same value: there is one database in CI.
      DIRECT_URL:         postgresql://familista_ci:familista_ci_pw@localhost:5432/familista_ci
      JWT_ACCESS_SECRET:  ci-secret-do-not-use
      JWT_REFRESH_SECRET: ci-secret-do-not-use-refresh
      JWT_ACCESS_TTL:     15m
      JWT_REFRESH_TTL:    7d
      JWT_ISSUER:         familista

    # Actions are pinned to a full commit SHA, not a tag: a tag can be moved to
    # different code after review, a commit cannot. The comment names the
    # release; Dependabot updates both together.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Prisma format (verify schema)
        run: npx prisma format --schema=prisma/schema.prisma

      - name: Prisma generate
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: TypeScript build
        run: npm run build

      - name: Boot probe (verify route registration)
        run: node scripts/boot-probe.js

      # A feature with user-facing text is not finished until every locale is
      # synchronized — see CLAUDE.md. Gated here, on the pull request, and
      # deliberately NOT in the Render build: a missing translation must stop a
      # change from merging, not stop production from starting.
      - name: i18n check (locales synchronized)
        run: npm run i18n:check

      # The contract between the owner APIs and the screens that read them.
      #
      # Named as its own step rather than left inside the suite below, because
      # this is the class of failure whose message matters: it names the
      # endpoint, the field, what arrived and WHICH SCREEN breaks. A reviewer
      # reading a red build should see "contract" in the step name and know
      # what broke before opening the log.
      #
      # Authoritative, not informational. No `|| true`.
      - name: API / frontend contract verification
        run: npm run contract:check

      # The test suite, which until now did not gate anything.
      #
      # 3760 tests ran on every developer's machine and on no pull request, so
      # a change could turn the whole suite red and still merge green. That is
      # how the contract defect this layer exists for reached main. Fifty-five
      # seconds is a small price for the suite actually meaning something.
      - name: Test suite
        run: npm test

      # Cyber Defense, Step 10: a backup that has never been restored is a
      # hope, not a backup. The real pg_dump takes an encrypted, signed backup
      # of a freshly migrated and seeded database; the real pg_restore brings
      # it back into an empty one, and the drill proves the rows returned.
      # BACKUP_DRILL_REQUIRED makes a missing URL fail here instead of skipping.
      - name: Backup restore drill (real PostgreSQL)
        env:
          BACKUP_DRILL_DATABASE_URL: postgresql://familista_ci:familista_ci_pw@localhost:5432/postgres
          BACKUP_DRILL_REQUIRED: '1'
        run: |
          pg_dump --version
          npx jest --runInBand --ci tests/backup-restore-drill.integration.test.ts

      # Cyber Defense, Batch 6 (R9): the audit evidence is append-only in the
      # database itself. A freshly migrated database; the application's own
      # role tries to rewrite, delete and truncate the evidence and is refused,
      # while appending still works and the hash chain still verifies.
      - name: Audit evidence append-only (real PostgreSQL)
        env:
          AUDIT_DB_DATABASE_URL: postgresql://familista_ci:familista_ci_pw@localhost:5432/postgres
          AUDIT_DB_REQUIRED: '1'
        run: npx jest --runInBand --ci tests/audit-append-only.integration.test.ts

      # Cyber Defense, Batch 7 (R14): row-level security pilot. A role that is
      # NOT a superuser (a superuser skips every policy) owns a freshly
      # migrated database; with enforcement on, no context and another club's
      # context see and change nothing, the named system path sees all, and
      # the real pg_dump / pg_restore keep every club's rows.
      - name: Row-level security pilot (real PostgreSQL)
        env:
          RLS_DB_DATABASE_URL: postgresql://familista_ci:familista_ci_pw@localhost:5432/postgres
          RLS_DB_REQUIRED: '1'
        run: npx jest --runInBand --ci tests/rls-pilot.integration.test.ts

      # Final Security Closure, Task 1, on the same kind of database with R14
      # enforced: self-registration into a club is refused and grants nothing,
      # the invitation path still creates a club-scoped account, and a franchise
      # unit cannot take, move or drop a club it has no authority over.
      - name: Security closure Task 1 (real PostgreSQL)
        env:
          RLS_DB_DATABASE_URL: postgresql://familista_ci:familista_ci_pw@localhost:5432/postgres
          RLS_DB_REQUIRED: '1'
        run: npx jest --runInBand --ci tests/security-closure-task1.integration.test.ts

      # Algorithms Step 2: production telemetry of the registered algorithms,
      # on a freshly migrated database. Concurrent writers add up exactly, the
      # windows the room reads are right, retention deletes what it should, a
      # non-UTC session cannot move an hour, and the database itself refuses a
      # name, an address or a sentence in any column.
      - name: Algorithm telemetry (real PostgreSQL)
        env:
          ALGO_TELEMETRY_DB_DATABASE_URL: postgresql://familista_ci:familista_ci_pw@localhost:5432/postgres
          ALGO_TELEMETRY_DB_REQUIRED: '1'
        run: npx jest --runInBand --ci tests/algorithm-telemetry.integration.test.ts

      # Blocking since Cyber Defense Step 9: a dependency with a known HIGH or
      # CRITICAL advisory stops the change from merging. Moderate and low are
      # still printed. If the advisory service cannot be reached the step
      # fails rather than passing unchecked.
      - name: Audit (blocking on high and critical)
        run: npm audit --audit-level=high

  # Cyber Defense, Step 9: no credential enters the repository. gitleaks scans
  # the WHOLE history on every pull request and every push to main, so a secret
  # committed and then deleted is still caught. Findings are printed redacted;
  # a value never reaches the log.
  #
  # The binary is a pinned release whose SHA-256 is checked before it runs; a
  # tampered or substituted download stops the job. It runs with
  # .gitleaks.toml: the default rules plus Familista's own for PostgreSQL
  # connection strings and committed environment files, which the defaults
  # missed. Reviewed findings are listed by fingerprint (commit:file:rule:line,
  # no values) in .gitleaksignore.
  secret-scan:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.29.1
      GITLEAKS_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan history for secrets
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-level info
