<script>
window.dpMount('dp-host');
var DP = window._DP;

  destinations: [{name:'Operational Data',live:true},{name:'Media',live:true},{name:'Audit',live:true},{name:'Analytics',live:true}],

  lastEventAt:new Date().toISOString(), processed:null, failed:null, pending:null, notInstrumented:['processed','failed','pending'] };

window.__repaint();
var mk = function (id, type, src, dst, cls, who) {
  return { eventId:id, eventType:type, schemaVersion:1,
    occurredAt:new Date().toISOString(), recordedAt:new Date().toISOString(), latencyMs:6,
    clubId:'fc', teamId:'t1', subjectType:'PLAYER', subjectId:null, sourceType:'USER',

    source:src, destination:dst, registered:true, status:'STORED',

};
setTimeout(function () {
  window.__feed([
    mk('e1','player.updated','Players','Operational Data','CONFIDENTIAL','Amara Okonkwo'),
    mk('e2','media.created','Media','Media','INTERNAL',null),
